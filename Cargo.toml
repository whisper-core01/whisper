[package]
name = "whisper"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde_json = "1.0"
rand = "0.8"
bincode = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
flate2 = "1.0"
chacha20poly1305 = "0.10.1"
anyhow = "1.0.102"
wasmtime = "45.0.1"
wasmtime-wasi = "45.0.1"

[dev-dependencies]
wat = "1.251.0"
